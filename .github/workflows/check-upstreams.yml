name: Check official sources
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
jobs:
  check:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v6
        with:
          submodules: true
      - name: Verify pinned original files and references
        run: bash scripts/update_upstreams.sh --check
      - name: Verify local edit protection and text processing
        run: bash scripts/tests/test_upstreams.sh
      - name: Verify plugin loading and portable document links
        run: node --test scripts/tests/test_orca_plugin.mjs scripts/tests/test_plugin_links.mjs scripts/tests/test_hermes_plugin.mjs
      - name: Verify standalone Archify package and delivery protection
        run: node --test scripts/tests/test_archify.mjs
